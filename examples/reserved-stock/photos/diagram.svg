<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="d-title d-desc" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title id="d-title">Shop shows on hand minus reserved</title>
  <desc id="d-desc">Ten items are on the shelf. Five are in paid orders that are not yet shipped. Two are held for shoppers in checkout. Those seven are reserved. Ten on hand minus seven reserved leaves three free to sell, so the shop shows "Only 3 left".</desc>
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffffff"/>
      <rect width="6" height="14" fill="#1f7a75"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f1d1a"/>
    </marker>
  </defs>

  <text x="90" y="90" font-size="34" fill="#1f1d1a" font-weight="700">ON THE SHELF: <tspan id="count-onhand">10</tspan></text>

  <!-- Row 1: paid, not yet shipped -->
  <g id="box-1" class="box paid"><rect x="90" y="120" width="120" height="120" rx="10" fill="#2a2724"/><text x="150" y="190" text-anchor="middle" font-size="24" fill="#ffffff">paid</text></g>
  <g id="box-2" class="box paid"><rect x="240" y="120" width="120" height="120" rx="10" fill="#2a2724"/><text x="300" y="190" text-anchor="middle" font-size="24" fill="#ffffff">paid</text></g>
  <g id="box-3" class="box paid"><rect x="390" y="120" width="120" height="120" rx="10" fill="#2a2724"/><text x="450" y="190" text-anchor="middle" font-size="24" fill="#ffffff">paid</text></g>
  <g id="box-4" class="box paid"><rect x="540" y="120" width="120" height="120" rx="10" fill="#2a2724"/><text x="600" y="190" text-anchor="middle" font-size="24" fill="#ffffff">paid</text></g>
  <g id="box-5" class="box paid"><rect x="690" y="120" width="120" height="120" rx="10" fill="#2a2724"/><text x="750" y="190" text-anchor="middle" font-size="24" fill="#ffffff">paid</text></g>

  <!-- Row 2: two held in checkout, three free -->
  <g id="box-6" class="box held"><rect x="90" y="270" width="120" height="120" rx="10" fill="url(#hatch)" stroke="#1f7a75" stroke-width="4"/><rect x="108" y="312" width="84" height="36" rx="6" fill="#ffffff"/><text x="150" y="338" text-anchor="middle" font-size="24" fill="#1f7a75" font-weight="700">held</text></g>
  <g id="box-7" class="box held"><rect x="240" y="270" width="120" height="120" rx="10" fill="url(#hatch)" stroke="#1f7a75" stroke-width="4"/><rect x="258" y="312" width="84" height="36" rx="6" fill="#ffffff"/><text x="300" y="338" text-anchor="middle" font-size="24" fill="#1f7a75" font-weight="700">held</text></g>
  <g id="box-8" class="box free"><rect x="392" y="272" width="116" height="116" rx="10" fill="#ffffff" stroke="#c4432a" stroke-width="5"/><text x="450" y="338" text-anchor="middle" font-size="24" fill="#c4432a" font-weight="700">free</text></g>
  <g id="box-9" class="box free"><rect x="542" y="272" width="116" height="116" rx="10" fill="#ffffff" stroke="#c4432a" stroke-width="5"/><text x="600" y="338" text-anchor="middle" font-size="24" fill="#c4432a" font-weight="700">free</text></g>
  <g id="box-10" class="box free"><rect x="692" y="272" width="116" height="116" rx="10" fill="#ffffff" stroke="#c4432a" stroke-width="5"/><text x="750" y="338" text-anchor="middle" font-size="24" fill="#c4432a" font-weight="700">free</text></g>

  <!-- Key -->
  <g font-size="28" fill="#1f1d1a">
    <rect x="90" y="450" width="40" height="40" rx="6" fill="#2a2724"/>
    <text x="150" y="480">Paid, not yet shipped: <tspan id="count-paid" font-weight="700">5</tspan></text>
    <rect x="90" y="515" width="40" height="40" rx="6" fill="url(#hatch)" stroke="#1f7a75" stroke-width="3"/>
    <text x="150" y="545">Held in a checkout: <tspan id="count-held" font-weight="700">2</tspan></text>
    <rect x="92" y="582" width="36" height="36" rx="6" fill="#ffffff" stroke="#c4432a" stroke-width="4"/>
    <text x="150" y="610">Free to sell: <tspan id="count-free" font-weight="700" fill="#c4432a">3</tspan></text>
  </g>
  <!-- Bracket: reserved = paid + held -->
  <path d="M660 452 h20 v100 h-20" fill="none" stroke="#1f1d1a" stroke-width="3"/>
  <text x="700" y="495" font-size="26" fill="#1f1d1a" font-weight="700">RESERVED</text>
  <text x="700" y="530" font-size="26" fill="#1f1d1a"><tspan id="count-reserved">7</tspan> items</text>

  <!-- Arrow: on hand minus reserved -->
  <line x1="450" y1="650" x2="450" y2="745" stroke="#1f1d1a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="475" y="705" font-size="26" fill="#6b655c">on hand − reserved</text>

  <!-- Result -->
  <rect x="90" y="765" width="720" height="170" rx="18" fill="#ffffff" stroke="#1f1d1a" stroke-width="3"/>
  <text x="450" y="818" text-anchor="middle" font-size="26" fill="#6b655c">THE PRODUCT PAGE SHOWS</text>
  <text id="result-text" x="450" y="892" text-anchor="middle" font-size="58" font-family="Georgia, 'Times New Roman', serif" fill="#c4432a" font-weight="700">Only 3 left</text>
</svg>
